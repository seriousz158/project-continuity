name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify source package
        shell: bash
        run: |
          python scripts/package_skill.py "$RUNNER_TEMP/project-continuity-v0.2.0-rc.1.zip"
          python - <<'PY'
          import hashlib, os, pathlib
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "project-continuity-v0.2.0-rc.1.zip"
          expected = archive.with_name(archive.name + ".sha256").read_text(encoding="ascii").split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          PY
